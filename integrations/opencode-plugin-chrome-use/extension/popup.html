<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>WorktreeProof Chrome Use</title>
  <style>
    body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; width: 320px; padding: 16px; }
    h1 { font-size: 16px; margin: 0 0 12px; color: #1a1a1a; }
    .status { padding: 8px 12px; border-radius: 6px; margin-bottom: 12px; font-size: 13px; }
    .status.connected { background: #e6f4ea; color: #1e6e3e; }
    .status.disconnected { background: #fce8e6; color: #c5221f; }
    .btn { width: 100%; padding: 10px 16px; border: none; border-radius: 6px; font-size: 13px; cursor: pointer; margin-bottom: 8px; transition: opacity 0.15s; }
    .btn:hover { opacity: 0.9; }
    .btn:active { opacity: 0.7; }
    .btn-primary { background: #1a73e8; color: white; }
    .btn-secondary { background: #f1f3f4; color: #3c4043; }
    .btn-danger { background: #fce8e6; color: #c5221f; }
    .info { font-size: 12px; color: #5f6368; margin-top: 12px; }
    .hidden { display: none; }
  </style>
</head>
<body>
  <h1>WorktreeProof Chrome Use</h1>
  <div id="status" class="status disconnected">Not connected to CDP</div>
  <button id="connectBtn" class="btn btn-primary">Connect to Chrome (CDP 9222)</button>
  <button id="disconnectBtn" class="btn btn-danger hidden">Disconnect</button>
  <button id="tabsBtn" class="btn btn-secondary">List Tabs</button>
  <div class="info">
    Requires Chrome started with:<br>
    <code>--remote-debugging-port=9222</code>
  </div>
  <script src="popup.js"></script>
</body>
</html>
